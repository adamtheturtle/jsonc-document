---
name: Lint

on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: 0 1 * * *
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: lint-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        group: [fast, typecheck, pylint, docs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204  # v3.0.1
        with:
          prek-version: 0.5.5
          extra-args: --all-files --group ${{ matrix.group }} --verbose
        env:
          UV_PYTHON: ${{ matrix.python }}
  completion-lint:
    needs: [lint]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every lint job
        env:
          RESULT: ${{ needs.lint.result }}
        run: test "$RESULT" = success
