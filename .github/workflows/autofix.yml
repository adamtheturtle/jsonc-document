---
name: autofix.ci

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Run fixers
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d  # v3.1.0
        with:
          # Matches the ``prek`` pin in ``pyproject.toml``; keep them in
          # sync. prek reimplements the ``pre-commit-hooks`` checks
          # natively, so a version difference changes their verdicts and
          # not merely their scheduling (issue 4013).
          prek-version: 0.5.5
          extra-args: >-
            --all-files --hook-stage pre-commit --no-fail-fast --verbose
        env:
          UV_NO_CACHE: '1'
          UV_PYTHON: 3.14

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a  # v1.3.4
        if: always()
